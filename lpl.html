<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>

@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f5fa;--bg2:#e9edf6;--card:#fff;--line:#d5dcec;--tx:#101830;--mu:#5b6685;--gold:#b97a00}}
:root[data-theme="light"]{--bg:#f3f5fa;--bg2:#e9edf6;--card:#fff;--line:#d5dcec;--tx:#101830;--mu:#5b6685;--gold:#b97a00}
:root[data-theme="dark"]{--bg:#0b1220}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 'DM Sans',system-ui,sans-serif;padding-bottom:76px}
h1,h2,h3,.disp{font-family:'Barlow Condensed',Impact,sans-serif;font-weight:800;letter-spacing:.01em;margin:0;line-height:1.05}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:auto;display:flex;gap:10px;align-items:center;padding:10px 14px}
.logo{font-size:26px;display:flex;align-items:center;gap:8px}.logo i{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7a59,#b3122e 60%);box-shadow:inset -3px -3px 0 rgba(0,0,0,.25);position:relative}
.logo i:after{content:"";position:absolute;inset:6px 2px;border-top:2px dotted #fff8;border-bottom:2px dotted #fff8;border-radius:50%}
select,input{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;min-width:0}
#q{flex:1}.sp{flex:1}
main{max-width:1100px;margin:auto;padding:16px 14px}
nav.b{position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg2);border-top:1px solid var(--line);display:flex;z-index:20}
nav.b a{flex:1;text-align:center;padding:10px 0 9px;color:var(--mu);font-size:12px;font-weight:700}nav.b a b{display:block;font-size:19px}nav.b a.on{color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}.row{display:flex;align-items:center;gap:10px}.sb{justify-content:space-between}
.mu{color:var(--mu)}.sm{font-size:13px}h2{font-size:28px;margin:26px 0 10px}h2 small{font:500 13px 'DM Sans';color:var(--mu);margin-left:8px}
.bdg{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;font:800 17px 'Barlow Condensed';color:#fff;background:var(--c);box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--c)}
.bdg.l{width:72px;height:72px;font-size:30px;border-radius:20px}
.hero{border-radius:22px;padding:22px 18px;background:radial-gradient(120% 140% at 85% 0,#3b2f0a55,transparent 55%),linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line)}
.hero h1{font-size:clamp(40px,9vw,76px)}.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--bg2);border:1px solid var(--line)}.gold{color:var(--gold);border-color:var(--gold)}
.score{font:800 30px 'Barlow Condensed'}.win{color:var(--gold)}
table{width:100%;border-collapse:collapse}th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mu);font-size:12px;font-weight:700}td.n,th.n{text-align:right}.sc{overflow-x:auto}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}.tabs button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px}.tabs button.on{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}
.big{font:800 44px 'Barlow Condensed';color:var(--gold)}.empty{border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--mu);text-align:center}
.bar2{height:8px;border-radius:9px;background:var(--bg2);overflow:hidden}.bar2 i{display:block;height:100%;background:var(--c,var(--gold))}
#sr{position:absolute;left:14px;right:14px;top:100%;max-width:560px;background:var(--card);border:1px solid var(--line);border-radius:14px;display:none;max-height:60vh;overflow:auto}#sr a{display:block;padding:10px 14px;border-bottom:1px solid var(--line)}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--bg2);color:var(--mu)}
@media(min-width:800px){body{padding-bottom:0}nav.b{position:static;border:0;background:none;max-width:1100px;margin:auto}nav.b a{flex:none;padding:6px 14px;font-size:14px}nav.b a b{display:none}}
@media(prefers-reduced-motion:no-preference){.hero{animation:in .6s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}}}
</style></head><body>

function vote(n){let v={};try{v=JSON.parse(localStorage.lplv||'{}')}catch(e){}v[n]=(v[n]||0)+1;try{localStorage.lplv=JSON.stringify(v)}catch(e){}route()}
const NAV=[['','🏠','Home'],['matches','🏏','Matches'],['stats','📊','Stats'],['teams','🛡️','Teams'],['more','☰','More']];
function route(){const[,p,a,b]=location.hash.split('/');const k=p||'';let h;
 if(k=='more')h=`<h2>More</h2><div class="grid">${[['players','Players'],['table','Points table'],['rankings','Rankings'],['records','Records'],['awards','Awards & Hall of Fame'],['compare','Compare players'],['fun','Fan favourite'],['data','Data notes']].map(([x,l])=>`<a class="card" href="#/${x}"><b>${l}</b></a>`).join('')}</div>`;
 else h=(pages[k||'home']||pages.home)(a,b);
 $('#app').innerHTML=h;$('#nav').innerHTML=NAV.map(([x,i,l])=>`<a href="#/${x}" class="${(k||'')==x||(x=='more'&&['players','table','rankings','records','awards','compare','fun','data','player'].includes(k))?'on':''}"><b>${i}</b>${l}</a>`).join('');scrollTo(0,0);
 if(k=='compare'){const A=a?decodeURIComponent(a):'Nikunj',B=b?decodeURIComponent(b):'Jay';$('#ca').value=A;$('#cb').value=B;const go=()=>location.hash='#/compare/'+encodeURIComponent($('#ca').value)+'/'+encodeURIComponent($('#cb').value);$('#ca').onchange=go;$('#cb').onchange=go}}
$('#ss').innerHTML=[...seasons].reverse().map(s=>`<option value="${s.season_id}">${E(s.name)}</option>`).join('')+'<option value="all">All-time LPL</option>';
$('#ss').onchange=e=>{S=e.target.value;route()};
$('#th').onclick=()=>{const d=document.documentElement,l=matchMedia('(prefers-color-scheme:light)').matches;d.dataset.theme=(d.dataset.theme||(l?'light':'dark'))=='dark'?'light':'dark'};
$('#q').oninput=e=>{const q=e.target.value.trim().toLowerCase(),sr=$('#sr');if(!q){sr.style.display='none';return}
 const r=[...D.players.filter(p=>p.name.toLowerCase().includes(q)).map(p=>[`#/player/${p.player_id}`,`Player · ${p.name}`]),...D.teams.filter(t=>t.name.toLowerCase().includes(q)).map(t=>[`#/team/${t.team_id}`,`Team · ${t.name}`]),...D.matches.filter(m=>(m.match_id+T[m.team_a].name+T[m.team_b].name).toLowerCase().includes(q)).map(m=>[`#/match/${m.match_id}`,`Match · ${m.match_id} ${T[m.team_a].name} v ${T[m.team_b].name}`]),...seasons.filter(s=>s.name.toLowerCase().includes(q)).map(s=>[`#/matches`,`Season · ${s.name}`])].slice(0,12);
 sr.innerHTML=r.map(x=>`<a href="${x[0]}">${E(x[1])}</a>`).join('')||'<a>No results</a>';sr.style.display='block'};
document.addEventListener('click',e=>{if(!e.target.closest('#sr,#q'))$('#sr').style.display='none';else if(e.target.closest('#sr a'))setTimeout(()=>{$('#sr').style.display='none';$('#q').value=''},0)});
addEventListener('hashchange',route);route();
</script></body></html>
